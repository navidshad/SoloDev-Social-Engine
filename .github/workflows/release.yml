name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Avoid infinite loops by skipping if the commit was a release bump
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get Recent Commits
        id: commits
        run: |
          # Ensure full history and tags are available
          git fetch --prune --unshallow || true
          git fetch --tags --force
          
          # Get commits since last tag
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No previous tag found. Using all commits."
            COMMITS=$(git log --pretty=format:"* %s")
          else
            echo "Found latest tag: $LATEST_TAG. Getting commits since then."
            # Use git log with the range. If the range only includes the current 'release:' commit, 
            # it might look empty to Gemini.
            COMMITS=$(git log "$LATEST_TAG..HEAD" --pretty=format:"* %s")
            
            # Fallback: If COMMITS is empty or very short, get the last 20 commits for context
            if [ -z "$COMMITS" ] || [ $(echo "$COMMITS" | wc -l) -lt 2 ]; then
              echo "Commit range was too short. Falling back to last 20 commits."
              COMMITS=$(git log -n 20 --pretty=format:"* %s")
            fi
          fi
          
          # Save to a file
          echo "$COMMITS" > commits.txt

      - name: Bump version and create tag
        id: version-bump
        run: |
          # Check if the commit message starts with "release:"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == release:* ]]; then
            echo "Manual release detected. Skipping auto-bump."
            VERSION=$(node -p "require('./package.json').version")
            # Create the tag manually since npm version was skipped
            git tag "v$VERSION"
          else
            # Increment patch version, create commit and tag
            npm version patch -m "chore: release %s [skip ci]"
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Push changes and tag
        run: |
          git push origin main --follow-tags

      - name: Get Project Context
        id: context
        run: |
          # Read README to provide context to Gemini
          if [ -f README.md ]; then
            cat README.md > project_context.txt
          else
            echo "No README found" > project_context.txt
          fi
          # Ensure .gemini directory exists to avoid CLI errors
          mkdir -p ~/.gemini

      - name: Generate AI Release Notes
        id: gemini-notes
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-2.5-flash
          prompt: |
            You are a technical writer specialized in software release notes.
            
            PROJECT CONTEXT:
            $(cat project_context.txt)
            
            RELEASE VERSION: ${{ steps.version-bump.outputs.version }}
            
            COMMIT HISTORY:
            $(cat commits.txt)
            
            INSTRUCTIONS:
            1. Analyze the project context and commit history.
            2. If the version is v1.0.0, start with an inspiring and celebratory introduction about the SoloDev Social Engine project, its mission, and what this major milestone represents.
            3. For all versions, generate a professional, engaging summary of the new features, improvements, and fixes.
            4. Group them logically (e.g., Features, Bug Fixes, Chores).
            5. Keep it concise but informative.
            
            IMPORTANT: Return only the raw markdown content. Do not wrap the entire response in a markdown code block (e.g., do not use ```markdown ... ``` or any other code block markers for the summary itself).
            
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version-bump.outputs.version }}
          name: Release ${{ steps.version-bump.outputs.version }}
          body: |
            ## ✨ AI-Generated Summary
            ${{ steps.gemini-notes.outputs.summary }}
            
            ---
            
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
